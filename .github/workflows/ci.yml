name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check .

      - name: Run Automated Test Suite
        env:
          APP_ENV: test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long! # pragma: allowlist secret
          DATABASE_URL: sqlite:///./ci_test.db
        run: |
          pytest -v --maxfail=1
