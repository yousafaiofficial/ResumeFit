name: CI Pipeline

on:
  push:
    branches: [ "main", "deployment/phase-2-1-reliability" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt
          pip install pre-commit==4.7.0

      - name: Run mypy
        run: python -m mypy app

      - name: Scan secrets with configured baseline
        run: pre-commit run detect-secrets --all-files

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check .

      - name: Run Automated Test Suite
        env:
          APP_ENV: test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long! # pragma: allowlist secret
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          pytest -v --maxfail=1

  postgres-integration:
    name: PostgreSQL Migration and Startup Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: resumefit
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d resumefit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/resumefit
      ALLOWED_ORIGINS: '["http://localhost:8000","http://127.0.0.1:8000"]'
      ALLOWED_HOSTS: '["localhost","127.0.0.1","testserver"]'
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Configure Ephemeral Signing Secret
        run: |
          python -c "import secrets; print('SECRET_KEY=' + secrets.token_urlsafe(48))" >> "$GITHUB_ENV"

      - name: Migrate Fresh Database
        run: alembic upgrade head

      - name: Upgrade Database from Previous Revision
        run: |
          psql "postgresql://postgres@localhost:5432/postgres" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE resumefit_upgrade"
          DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/resumefit_upgrade \
            alembic upgrade 047aac60574f
          DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/resumefit_upgrade \
            alembic upgrade head

      - name: Inspect Migrated Schemas
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect

          urls = [
              "postgresql+psycopg://postgres@localhost:5432/resumefit",
              "postgresql+psycopg://postgres@localhost:5432/resumefit_upgrade",
          ]
          required_indexes = {
              "ix_user_sessions_token_hash",
              "ix_user_sessions_user_id",
              "ix_user_sessions_user_expires",
          }
          for url in urls:
              engine = create_engine(url)
              inspector = inspect(engine)
              assert "user_sessions" in inspector.get_table_names()
              assert required_indexes <= {
                  index["name"] for index in inspector.get_indexes("user_sessions")
              }
              assert inspector.get_foreign_keys("user_sessions")[0]["referred_table"] == "users"
              assert inspector.get_pk_constraint("user_sessions")["constrained_columns"] == [
                  "id"
              ]
              engine.dispose()
          PY

      - name: Verify Application Health and Authentication
        run: |
          python - <<'PY'
          import subprocess

          from sqlalchemy import text

          from fastapi.testclient import TestClient

          from app.core.database import engine
          from app.main import app

          with engine.connect() as connection:
              backend_pid = connection.execute(text("SELECT pg_backend_pid()")).scalar_one()
          result = subprocess.run(
              [
                  "psql",
                  "postgresql://postgres@localhost:5432/resumefit",
                  "-v",
                  "ON_ERROR_STOP=1",
                  "-c",
                  f"SELECT pg_terminate_backend({backend_pid})",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          assert any(line.strip() == "t" for line in result.stdout.splitlines())
          with engine.connect() as connection:
              assert connection.execute(text("SELECT 1")).scalar_one() == 1

          origin = {"Origin": "http://localhost:8000"}
          with TestClient(app) as client:
              assert client.get("/healthz").status_code == 200
              assert client.get("/readyz").status_code == 200

              pre_auth = client.get("/api/v1/auth/csrf").json()["csrf_token"]
              registered = client.post(
                  "/api/v1/auth/register",
                  json={"email": "postgres-ci@example.invalid", "password": "CIOnlyPassword123!"},
                  headers={**origin, "X-CSRF-Token": pre_auth},
              )
              assert registered.status_code == 201, registered.text
              logout = client.post(
                  "/api/v1/auth/logout",
                  headers={**origin, "X-CSRF-Token": registered.json()["csrf_token"]},
              )
              assert logout.status_code == 204
              assert client.get("/api/v1/auth/me").status_code == 401

              pre_auth = client.get("/api/v1/auth/csrf").json()["csrf_token"]
              login = client.post(
                  "/api/v1/auth/login",
                  json={"email": "postgres-ci@example.invalid", "password": "CIOnlyPassword123!"},
                  headers={**origin, "X-CSRF-Token": pre_auth},
              )
              assert login.status_code == 200, login.text
              csrf = login.json()["csrf_token"]
              analysis = client.post(
                  "/api/v1/analyze",
                  data={
                      "job_description": (
                          "Backend engineer needed with Python, PostgreSQL, API design, "
                          "automated testing, and reliable production operations."
                      ),
                      "resume_text": (
                          "Backend engineer with Python, PostgreSQL, API design, automated "
                          "testing, Linux, and reliable production operations experience."
                      ),
                  },
                  headers={**origin, "X-CSRF-Token": csrf},
              )
              assert analysis.status_code == 200, analysis.text
              history = client.get("/api/v1/history")
              assert history.status_code == 200
              assert len(history.json()["items"]) == 1
              assert client.post(
                  "/api/v1/auth/logout",
                  headers={**origin, "X-CSRF-Token": csrf},
              ).status_code == 204
              assert client.get("/api/v1/auth/me").status_code == 401
          PY

      - name: Build Runtime Image and Verify Imports
        env:
          APP_ENV: prod
          ALLOWED_ORIGINS: '["https://resume.example"]'
          ALLOWED_HOSTS: '["resume.example","127.0.0.1"]'
        run: |
          docker build --target runtime -t resumefit:ci .
          export POSTGRES_PASSWORD="$(python -c "import secrets; print(secrets.token_urlsafe(32))")"
          docker compose config --quiet
          docker run --rm --entrypoint python \
            -e APP_ENV=test \
            -e SECRET_KEY="$SECRET_KEY" \
            -e DATABASE_URL=sqlite:///:memory: \
            -e ALLOWED_ORIGINS='["http://localhost:8000"]' \
            -e ALLOWED_HOSTS='["localhost","127.0.0.1"]' \
            resumefit:ci -c "import app.main"
